<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Quest</title>

  <!-- PWA & iPad Home Screen App Configuration -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Word Quest">
  <meta name="theme-color" content="#050510">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050510;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      gap: 10px;
    }

    #game-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-height: 66vh;
      aspect-ratio: 4 / 3;
      box-shadow: 0 0 28px rgba(0, 255, 204, 0.35), 0 0 10px rgba(255, 0, 128, 0.25);
      border: 4px solid #38ef7d;
      border-radius: 12px;
      background: #0a0a1a;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* Retro CRT scanline effect */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
    }

    /* iPad Arcade Control Bar: Action Controls on Left, Movement D-Pad on Right */
    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 4px 6px;
    }

    .action-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .utility-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
    }

    .ctrl-btn {
      background: linear-gradient(180deg, #1e2738 0%, #101622 100%);
      color: #e0f7ff;
      border: 2px solid #38ef7d;
      border-radius: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #145a32, 0 0 10px rgba(56, 239, 125, 0.2);
      transition: transform 0.05s, box-shadow 0.05s, background 0.1s;
    }

    .ctrl-btn:active,
    .ctrl-btn.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #145a32;
      background: #233b2e;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    .btn-fire {
      width: 130px;
      height: 116px;
      border-color: #ff4757;
      background: linear-gradient(180deg, #4b1520 0%, #240910 100%);
      color: #ffd32a;
      font-size: 20px;
      box-shadow: 0 5px 0 #781722, 0 0 16px rgba(255, 71, 87, 0.35);
    }

    .btn-fire:active,
    .btn-fire.active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #781722;
      background: #6e1c2b;
    }

    .btn-util {
      width: 96px;
      height: 54px;
      font-size: 13px;
      border-color: #00d2ff;
      box-shadow: 0 4px 0 #0a4d68;
    }

    .btn-util:active {
      box-shadow: 0 1px 0 #0a4d68;
      background: #14364a;
    }

    .instructions {
      font-size: 12px;
      color: #88ccff;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div class="crt-overlay"></div>
    </div>

    <!-- iPad Multi-Touch Arcade Controls -->
    <div class="controls-bar">
      <!-- Left: Sound, Restart & Fire -->
      <div class="action-cluster">
        <div class="utility-stack">
          <button class="ctrl-btn btn-util" id="btnSound" type="button">🔊 SOUND</button>
          <button class="ctrl-btn btn-util" id="btnRestart" type="button">↻ RESTART</button>
        </div>
        <button class="ctrl-btn btn-fire" id="btnFire" type="button">
          <span>⚡ FIRE</span>
          <span style="font-size:11px; margin-top:4px; color:#fff;">CAPTURE</span>
        </button>
      </div>

      <!-- Right: 4-Way Movement Pad -->
      <div class="dpad-grid">
        <button class="ctrl-btn btn-up" id="btnUp" type="button">▲<span style="font-size:11px;">FWD</span></button>
        <button class="ctrl-btn btn-left" id="btnLeft" type="button">◀<span style="font-size:11px;">LEFT</span></button>
        <button class="ctrl-btn btn-down" id="btnDown" type="button">▼<span style="font-size:11px;">BWD</span></button>
        <button class="ctrl-btn btn-right" id="btnRight" type="button">▶<span style="font-size:11px;">RIGHT</span></button>
      </div>
    </div>

    <div class="instructions">
      iPad Controls: Use Left Buttons to Fire &amp; Right Pad (or Drag) to Move | Keyboard: Arrows / WASD + Spacebar
    </div>
  </div>

<script>
// Register Service Worker & auto-reload when a new version activates
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      reg.update();
    }).catch(() => {});

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- 8-Bit Sound Synthesizer (Web Audio API) ---
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!soundEnabled) return;
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, delay = 0) {
    if (!soundEnabled || !audioCtx) return;
    setTimeout(() => {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }, delay);
  }

  const Sound = {
    catchCorrect: () => {
      playTone(523.25, 'triangle', 0.08, 0);
      playTone(659.25, 'triangle', 0.08, 60);
      playTone(783.99, 'square', 0.12, 120);
    },
    catchWrong: () => {
      playTone(180, 'sawtooth', 0.15, 0);
      playTone(130, 'sawtooth', 0.25, 100);
    },
    shoot: () => {
      playTone(880, 'square', 0.05, 0);
    },
    wordComplete: () => {
      playTone(523.25, 'square', 0.1, 0);
      playTone(659.25, 'square', 0.1, 100);
      playTone(783.99, 'square', 0.1, 200);
      playTone(1046.5, 'square', 0.3, 300);
    },
    nextStage: () => {
      playTone(659.25, 'triangle', 0.08, 0);
      playTone(880.00, 'triangle', 0.14, 70);
    },
    gameOver: () => {
      playTone(400, 'sawtooth', 0.2, 0);
      playTone(300, 'sawtooth', 0.2, 150);
      playTone(200, 'sawtooth', 0.4, 300);
    }
  };

  // --- 5 Core Value Stages (Ordered to spell C-C-A-S-S) ---
  const STAGES = [
    { word: 'CARE', desc: 'CARING FOR ALL', color: '#ff5e7e' },
    { word: 'COMMITMENT', desc: 'SHARED COMMITMENT', color: '#ff9f1a' },
    { word: 'APPRECIATION', desc: 'APPRECIATING EACH OTHER', color: '#a55eea' },
    { word: 'SUPPORT', desc: 'MUTUAL SUPPORT', color: '#00d2ff' },
    { word: 'SUCCESS', desc: 'STRIVING FOR SUCCESS', color: '#ffd32a' }
  ];

  // --- Game States ---
  const STATE = {
    START: 0,
    PLAYING: 1,
    WORD_CLEAR: 2,
    GAME_OVER: 3,
    GAME_WIN: 4
  };

  let gameState = STATE.START;
  let score = 0;
  let combo = 0;
  let timeLeft = 90;
  let currentStageIndex = 0;
  let currentWordProgress = 0;
  let lastTime = 0;
  let screenShake = 0;
  let nonTargetStreak = 0;
  let stageClearReadyTimer = 0;

  // Next Stage Button Hitbox on Canvas (800x600 space)
  const nextStageBtn = {
    x: 210,
    y: 365,
    w: 380,
    h: 58
  };

  // --- Player Starfighter ---
  const player = {
    x: 400,
    y: 520,
    width: 56,
    height: 46,
    speed: 440
  };

  const bounds = {
    minX: 38,
    maxX: 762,
    minY: 135,
    maxY: 560
  };

  let letters = [];
  let bullets = [];
  let particles = [];
  let floatingTexts = [];
  let stars = [];

  // Starfield Background
  for (let i = 0; i < 75; i++) {
    stars.push({
      x: Math.random() * 800,
      y: Math.random() * 600,
      size: Math.random() < 0.7 ? 1.5 : 2.5,
      speed: 0.6 + Math.random() * 1.6
    });
  }

  // --- Input Handling (Keyboard + iPad Multi-Touch) ---
  const keys = {};
  const touchState = {
    left: false,
    right: false,
    up: false,
    down: false
  };

  window.addEventListener('keydown', (e) => {
    initAudio();
    keys[e.code] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      handleAction();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  function bindHoldButton(elementId, directionKey) {
    const btn = document.getElementById(elementId);
    const press = (e) => {
      e.preventDefault();
      initAudio();
      touchState[directionKey] = true;
      btn.classList.add('active');
    };
    const release = (e) => {
      if (e) e.preventDefault();
      touchState[directionKey] = false;
      btn.classList.remove('active');
    };

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  }

  bindHoldButton('btnLeft', 'left');
  bindHoldButton('btnRight', 'right');
  bindHoldButton('btnUp', 'up');
  bindHoldButton('btnDown', 'down');

  const btnFire = document.getElementById('btnFire');
  btnFire.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    btnFire.classList.add('active');
    handleAction();
  });
  btnFire.addEventListener('pointerup', () => btnFire.classList.remove('active'));
  btnFire.addEventListener('pointerleave', () => btnFire.classList.remove('active'));
  btnFire.addEventListener('pointercancel', () => btnFire.classList.remove('active'));

  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    soundEnabled = !soundEnabled;
    if (soundEnabled) initAudio();
    btnSound.textContent = soundEnabled ? '🔊 SOUND' : '🔇 MUTED';
  });

  const btnRestart = document.getElementById('btnRestart');
  btnRestart.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    restartGame();
  });

  // Canvas Touch / Drag Support
  let activeCanvasPointerId = null;

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    const pos = getCanvasCoords(e);

    if (gameState === STATE.START || gameState === STATE.GAME_OVER || gameState === STATE.GAME_WIN) {
      restartGame();
      return;
    }

    if (gameState === STATE.WORD_CLEAR) {
      if (stageClearReadyTimer <= 0) {
        const inBtnX = pos.x >= nextStageBtn.x && pos.x <= nextStageBtn.x + nextStageBtn.w;
        const inBtnY = pos.y >= nextStageBtn.y && pos.y <= nextStageBtn.y + nextStageBtn.h;
        if (inBtnX && inBtnY) {
          advanceToNextStage();
        }
      }
      return;
    }

    if (gameState === STATE.PLAYING) {
      activeCanvasPointerId = e.pointerId;
      movePlayerToCanvasPos(pos);
      fireBullet();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (activeCanvasPointerId === e.pointerId && gameState === STATE.PLAYING) {
      const pos = getCanvasCoords(e);
      movePlayerToCanvasPos(pos);
    }
  });

  const clearCanvasPointer = (e) => {
    if (activeCanvasPointerId === e.pointerId) {
      activeCanvasPointerId = null;
    }
  };
  canvas.addEventListener('pointerup', clearCanvasPointer);
  canvas.addEventListener('pointercancel', clearCanvasPointer);

  function movePlayerToCanvasPos(pos) {
    player.x = Math.max(bounds.minX, Math.min(bounds.maxX, pos.x));
    player.y = Math.max(bounds.minY, Math.min(bounds.maxY, pos.y));
  }

  function handleAction() {
    if (gameState === STATE.START || gameState === STATE.GAME_OVER || gameState === STATE.GAME_WIN) {
      restartGame();
    } else if (gameState === STATE.WORD_CLEAR) {
      if (stageClearReadyTimer <= 0) {
        advanceToNextStage();
      }
    } else if (gameState === STATE.PLAYING) {
      fireBullet();
    }
  }

  function advanceToNextStage() {
    Sound.nextStage();
    currentStageIndex++;
    currentWordProgress = 0;
    nonTargetStreak = 0;
    letters = [];
    bullets = [];
    gameState = STATE.PLAYING;
  }

  function fireBullet() {
    Sound.shoot();
    bullets.push({
      x: player.x,
      y: player.y - 26,
      radius: 4.5,
      speed: 640
    });
  }

  function restartGame() {
    score = 0;
    combo = 0;
    timeLeft = 90;
    currentStageIndex = 0;
    currentWordProgress = 0;
    nonTargetStreak = 0;
    stageClearReadyTimer = 0;
    player.x = 400;
    player.y = 520;
    letters = [];
    bullets = [];
    particles = [];
    floatingTexts = [];
    gameState = STATE.PLAYING;
  }

  // --- Visual Effects ---
  function spawnExplosion(x, y, color, count = 16) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 40 + Math.random() * 140;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: color,
        life: 1.0,
        decay: 1.8 + Math.random() * 1.4,
        size: 2.5 + Math.random() * 3
      });
    }
  }

  function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({
      x: x,
      y: y,
      text: text,
      color: color,
      life: 1.0
    });
  }

  // --- Letter Spawning ---
  let letterSpawnTimer = 0;
  function spawnLetter() {
    const stage = STAGES[currentStageIndex];
    if (!stage || currentWordProgress >= stage.word.length) return;

    const currentWord = stage.word;
    const neededChar = currentWord[currentWordProgress];

    let charToSpawn = '';
    if (nonTargetStreak >= 2 || Math.random() < 0.62) {
      charToSpawn = neededChar;
      nonTargetStreak = 0;
    } else {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      charToSpawn = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (charToSpawn === neededChar) {
        nonTargetStreak = 0;
      } else {
        nonTargetStreak++;
      }
    }

    let spawnX = 60 + Math.random() * 680;
    for (let attempt = 0; attempt < 5; attempt++) {
      const tooClose = letters.some(l => l.y < 140 && Math.abs(l.x - spawnX) < 55);
      if (!tooClose) break;
      spawnX = 60 + Math.random() * 680;
    }

    const fallSpeed = 90 + (currentStageIndex * 14) + (Math.random() * 25);
    letters.push({
      char: charToSpawn,
      x: spawnX,
      y: 80,
      radius: 21,
      speed: fallSpeed,
      isTarget: (charToSpawn === neededChar)
    });
  }

  // --- Collision & Scoring ---
  function checkCollectLetter(letter, index) {
    const stage = STAGES[currentStageIndex];
    if (!stage || currentWordProgress >= stage.word.length) return false;

    const currentWord = stage.word;
    const neededChar = currentWord[currentWordProgress];

    if (letter.char === neededChar) {
      Sound.catchCorrect();
      currentWordProgress++;
      combo++;
      const feverMultiplier = combo >= 3 ? 2 : 1;
      const pointsEarned = 200 * feverMultiplier;
      score += pointsEarned;

      spawnExplosion(letter.x, letter.y, '#38ef7d', 20);
      spawnFloatingText(
        letter.x,
        letter.y - 10,
        feverMultiplier > 1 ? `+${pointsEarned} FEVER!` : `+${pointsEarned}`,
        '#38ef7d'
      );
      screenShake = 6;

      if (currentWordProgress >= currentWord.length) {
        onWordCompleted();
        return true;
      }
    } else {
      Sound.catchWrong();
      combo = 0;
      score = Math.max(0, score - 80);
      spawnExplosion(letter.x, letter.y, '#ff3838', 15);
      spawnFloatingText(letter.x, letter.y - 10, '-80', '#ff4757');
      screenShake = 11;
    }

    if (index >= 0 && index < letters.length) {
      letters.splice(index, 1);
    }
    return false;
  }

  function onWordCompleted() {
    Sound.wordComplete();
    score += 1000 + Math.floor(timeLeft * 10);
    timeLeft = Math.min(99, timeLeft + 5);
    spawnExplosion(400, 300, STAGES[currentStageIndex].color, 50);

    letters = [];
    bullets = [];

    if (currentStageIndex + 1 < STAGES.length) {
      gameState = STATE.WORD_CLEAR;
      stageClearReadyTimer = 0.35;
    } else {
      gameState = STATE.GAME_WIN;
    }
  }

  // --- Main Update Loop ---
  function update(dt) {
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 25);

    stars.forEach(star => {
      star.y += star.speed;
      if (star.y > 600) {
        star.y = 0;
        star.x = Math.random() * 800;
      }
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 42 * dt;
      ft.life -= 1.2 * dt;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    if (gameState === STATE.WORD_CLEAR) {
      if (stageClearReadyTimer > 0) {
        stageClearReadyTimer = Math.max(0, stageClearReadyTimer - dt);
      }
      return;
    }

    if (gameState !== STATE.PLAYING) return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      Sound.gameOver();
      gameState = STATE.GAME_OVER;
      return;
    }

    // 4-Way Movement
    let moveX = 0;
    let moveY = 0;
    if (keys['ArrowLeft'] || keys['KeyA'] || touchState.left) moveX -= 1;
    if (keys['ArrowRight'] || keys['KeyD'] || touchState.right) moveX += 1;
    if (keys['ArrowUp'] || keys['KeyW'] || touchState.up) moveY -= 1;
    if (keys['ArrowDown'] || keys['KeyS'] || touchState.down) moveY += 1;

    if (moveX !== 0 && moveY !== 0) {
      const diag = Math.SQRT1_2;
      moveX *= diag;
      moveY *= diag;
    }

    player.x = Math.max(bounds.minX, Math.min(bounds.maxX, player.x + moveX * player.speed * dt));
    player.y = Math.max(bounds.minY, Math.min(bounds.maxY, player.y + moveY * player.speed * dt));

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      if (gameState !== STATE.PLAYING) return;
      const b = bullets[i];
      if (!b) continue;

      b.y -= b.speed * dt;
      if (b.y < 95) {
        bullets.splice(i, 1);
        continue;
      }

      for (let j = letters.length - 1; j >= 0; j--) {
        const l = letters[j];
        if (!l) continue;

        const dist = Math.hypot(b.x - l.x, b.y - l.y);
        if (dist < l.radius + b.radius) {
          bullets.splice(i, 1);
          const completed = checkCollectLetter(l, j);
          if (completed || gameState !== STATE.PLAYING) return;
          break;
        }
      }
    }

    if (gameState !== STATE.PLAYING) return;

    // Spawn Falling Letters
    letterSpawnTimer += dt;
    const spawnRate = Math.max(0.65, 1.18 - (currentStageIndex * 0.11));
    if (letterSpawnTimer > spawnRate) {
      letterSpawnTimer = 0;
      spawnLetter();
    }

    // Update Letters & Player Collision
    const stage = STAGES[currentStageIndex];
    const neededChar = stage && currentWordProgress < stage.word.length
      ? stage.word[currentWordProgress]
      : '';

    for (let i = letters.length - 1; i >= 0; i--) {
      if (gameState !== STATE.PLAYING) return;
      const l = letters[i];
      if (!l) continue;

      l.y += l.speed * dt;
      l.isTarget = (l.char === neededChar);

      const distToPlayer = Math.hypot(player.x - l.x, player.y - l.y);
      if (distToPlayer < l.radius + 22) {
        const completed = checkCollectLetter(l, i);
        if (completed || gameState !== STATE.PLAYING) return;
        continue;
      }

      if (l.y > 630) {
        letters.splice(i, 1);
      }
    }
  }

  // --- Draw Triangular Pixel Starfighter ---
  function drawPlayerShip() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Twin Engine Thruster Flames
    const flameLen = 14 + Math.random() * 10;
    ctx.fillStyle = Math.random() < 0.5 ? '#ff4757' : '#ffa502';
    ctx.beginPath();
    ctx.moveTo(-14, 16);
    ctx.lineTo(-8, 16 + flameLen);
    ctx.lineTo(-3, 16);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(3, 16);
    ctx.lineTo(8, 16 + flameLen);
    ctx.lineTo(14, 16);
    ctx.closePath();
    ctx.fill();

    // Outer Wingtip Laser Pods
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(-28, 4, 4, 12);
    ctx.fillRect(24, 4, 4, 12);

    // Main Triangular Delta-Wing Hull
    ctx.fillStyle = '#1e90ff';
    ctx.beginPath();
    ctx.moveTo(0, -26);
    ctx.lineTo(28, 16);
    ctx.lineTo(12, 12);
    ctx.lineTo(0, 17);
    ctx.lineTo(-12, 12);
    ctx.lineTo(-28, 16);
    ctx.closePath();
    ctx.fill();

    // Hull Neon Outline
    ctx.strokeStyle = '#70a1ff';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Inner Triangular Armor Plate
    ctx.fillStyle = '#3742fa';
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(14, 10);
    ctx.lineTo(0, 6);
    ctx.lineTo(-14, 10);
    ctx.closePath();
    ctx.fill();

    // Pointed Cockpit Canopy
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(5, 2);
    ctx.lineTo(0, 5);
    ctx.lineTo(-5, 2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // --- Rendering ---
  function draw() {
    ctx.save();
    if (screenShake > 0) {
      const shakeX = (Math.random() - 0.5) * screenShake;
      const shakeY = (Math.random() - 0.5) * screenShake;
      ctx.translate(shakeX, shakeY);
    }

    // 1. Background & Starfield
    ctx.fillStyle = '#060613';
    ctx.fillRect(0, 0, 800, 600);

    ctx.fillStyle = '#ffffff';
    stars.forEach(star => {
      ctx.globalAlpha = star.speed > 1.2 ? 0.9 : 0.4;
      ctx.fillRect(star.x, star.y, star.size, star.size);
    });
    ctx.globalAlpha = 1.0;

    // 2. Particles
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    // 3. Laser Bolts
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 8;
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // 4. Falling Letters
    letters.forEach(l => {
      ctx.save();
      ctx.translate(l.x, l.y);

      ctx.fillStyle = 'rgba(16, 24, 48, 0.9)';
      ctx.beginPath();
      ctx.arc(0, 0, l.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 2.5;
      ctx.strokeStyle = l.isTarget ? '#38ef7d' : '#4a69bd';
      if (l.isTarget) {
        ctx.shadowColor = '#38ef7d';
        ctx.shadowBlur = 10;
      }
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 21px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.char, 0, 1);
      ctx.restore();
    });

    // 5. Player Triangular Starfighter
    drawPlayerShip();

    // 6. Floating Score Popups
    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    // 7. Top HUD
    drawHUD();

    // 8. State Overlays
    if (gameState === STATE.START) drawStartScreen();
    if (gameState === STATE.WORD_CLEAR) drawWordClearScreen();
    if (gameState === STATE.GAME_OVER) drawGameOverScreen();
    if (gameState === STATE.GAME_WIN) drawGameWinScreen();

    ctx.restore();
  }

  function drawHUD() {
    const stage = STAGES[currentStageIndex];
    ctx.fillStyle = 'rgba(5, 5, 20, 0.92)';
    ctx.fillRect(0, 0, 800, 96);
    ctx.strokeStyle = '#1e272e';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, 800, 96);

    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#ffd32a';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 22, 30);

    ctx.fillStyle = timeLeft < 20 ? '#ff3838' : '#00d2d3';
    ctx.textAlign = 'right';
    ctx.fillText(`TIME: ${Math.ceil(timeLeft)}s`, 778, 30);

    if (combo >= 3) {
      ctx.fillStyle = '#ff4757';
      ctx.font = 'italic bold 15px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`★ FEVER x2 (${combo}) ★`, 22, 56);
    }

    ctx.fillStyle = stage.color;
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`STAGE ${currentStageIndex + 1}/5: ${stage.desc}`, 400, 26);

    const word = stage.word;
    const boxSize = 34;
    const spacing = 8;
    const totalW = (word.length * boxSize) + ((word.length - 1) * spacing);
    const startX = 400 - (totalW / 2);

    for (let i = 0; i < word.length; i++) {
      const bx = startX + (i * (boxSize + spacing));
      const by = 42;
      const isFilled = i < currentWordProgress;
      const isCurrentTarget = (i === currentWordProgress);

      ctx.fillStyle = isFilled ? '#2ed573' : (isCurrentTarget ? '#2f3542' : '#1e272e');
      ctx.fillRect(bx, by, boxSize, boxSize);

      ctx.strokeStyle = isCurrentTarget ? '#ffd32a' : '#57606f';
      ctx.lineWidth = isCurrentTarget ? 2.5 : 1;
      ctx.strokeRect(bx, by, boxSize, boxSize);

      if (isFilled) {
        ctx.fillStyle = '#000';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(word[i], bx + boxSize / 2, by + boxSize / 2 + 1);
      } else if (isCurrentTarget) {
        ctx.fillStyle = Math.sin(Date.now() / 150) > 0 ? '#ffd32a' : '#ffffff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', bx + boxSize / 2, by + boxSize / 2);
      }
    }
  }

  function drawStartScreen() {
    ctx.fillStyle = 'rgba(4, 6, 18, 0.9)';
    ctx.fillRect(0, 0, 800, 600);

    ctx.strokeStyle = '#38ef7d';
    ctx.lineWidth = 3;
    ctx.strokeRect(60, 75, 680, 450);

    ctx.fillStyle = '#ffd32a';
    ctx.font = 'bold 26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('WELCOME TO CCASS', 400, 145);

    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 38px monospace';
    ctx.fillText('WORD QUEST', 400, 200);

    ctx.fillStyle = '#38ef7d';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('MASTER THE 5 CORE VALUES OF CCASS', 400, 242);

    ctx.fillStyle = '#ffffff';
    ctx.font = '15px monospace';
    ctx.fillText('Catch or shoot the falling letters in order to spell each value:', 400, 298);

    ctx.fillStyle = '#a4b0be';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('CARE • COMMITMENT • APPRECIATION • SUPPORT • SUCCESS', 400, 332);

    const pulse = Math.sin(Date.now() / 220) > 0;
    ctx.fillStyle = pulse ? '#38ef7d' : '#1e824c';
    ctx.fillRect(230, 395, 340, 62);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(230, 395, 340, 62);

    ctx.fillStyle = '#050510';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('▶ PRESS TO START ◀', 400, 434);
  }

  function drawWordClearScreen() {
    const stage = STAGES[currentStageIndex];
    ctx.fillStyle = 'rgba(4, 6, 18, 0.88)';
    ctx.fillRect(0, 96, 800, 504);

    ctx.strokeStyle = stage.color;
    ctx.lineWidth = 3;
    ctx.strokeRect(95, 145, 610, 320);

    ctx.fillStyle = '#ffd32a';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★ STAGE CLEAR! ★', 400, 205);

    ctx.fillStyle = stage.color;
    ctx.font = 'bold 28px monospace';
    ctx.fillText(`${stage.word} - ${stage.desc}`, 400, 260);

    ctx.fillStyle = '#2ed573';
    ctx.font = 'bold 19px monospace';
    ctx.fillText('+5 SECONDS BONUS ADDED!', 400, 305);

    ctx.fillStyle = '#a4b0be';
    ctx.font = '15px monospace';
    ctx.fillText(`Next Up: Stage ${currentStageIndex + 2} of 5`, 400, 340);

    // Interactive "PRESS TO THE NEXT STAGE" Button
    const pulse = Math.sin(Date.now() / 220) > 0;
    ctx.fillStyle = pulse ? '#38ef7d' : '#26a65b';
    ctx.fillRect(nextStageBtn.x, nextStageBtn.y, nextStageBtn.w, nextStageBtn.h);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(nextStageBtn.x, nextStageBtn.y, nextStageBtn.w, nextStageBtn.h);

    ctx.fillStyle = '#050510';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('▶ PRESS TO THE NEXT STAGE ◀', 400, nextStageBtn.y + 36);
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(20, 0, 0, 0.9)';
    ctx.fillRect(0, 0, 800, 600);

    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 46px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TIME IS UP!', 400, 220);

    ctx.fillStyle = '#ffffff';
    ctx.font = '24px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, 400, 290);

    ctx.fillStyle = '#ffd32a';
    ctx.font = 'bold 22px monospace';
    if (Math.sin(Date.now() / 220) > 0) {
      ctx.fillText('▶ TAP SCREEN OR PRESS FIRE TO TRY AGAIN ◀', 400, 390);
    }
  }

  function drawGameWinScreen() {
    ctx.fillStyle = 'rgba(5, 20, 12, 0.92)';
    ctx.fillRect(0, 0, 800, 600);

    ctx.fillStyle = '#ffd32a';
    ctx.font = 'bold 38px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★ ALL CCASS VALUES UNLOCKED! ★', 400, 175);

    ctx.fillStyle = '#38ef7d';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('CONGRATULATIONS, PIXEL GUARDIAN!', 400, 235);

    ctx.fillStyle = '#ffffff';
    ctx.font = '22px monospace';
    ctx.fillText(`FINAL HERO SCORE: ${score}`, 400, 305);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#70a1ff';
    ctx.fillText('Please visit the booth counter to claim your CCASS Prize!', 400, 355);

    ctx.fillStyle = '#00d2d3';
    ctx.font = 'bold 20px monospace';
    if (Math.sin(Date.now() / 220) > 0) {
      ctx.fillText('▶ TAP SCREEN OR PRESS FIRE TO PLAY AGAIN ◀', 400, 445);
    }
  }

  // --- Main Loop ---
  function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
      update(dt);
      draw();
    } catch (err) {
      console.error('Game loop error:', err);
    }

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
